<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-NOU Exchange</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Fullscreen Overlay Video -->
    <video id="background-video" autoplay loop muted playsinline>
        <source src="/assets/vid/exchange.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <!-- Background Effects -->
    <canvas id="neuron-background"></canvas>
    <div class="parallax-layer dot-field layer-1"></div>
    <div class="parallax-layer dot-field layer-2"></div>
    <div class="parallax-layer dot-field layer-3"></div>
    <div id="floating-numbers-container"></div>

    <!-- Main UI Content -->
    <div class="content-wrapper">
        <div class="container">
            <header>
                <h1>Z-NOU Exchange Terminal</h1>
                <div class="operator-info">
                    <span id="operator-id">OPERATOR: [INITIALIZING]</span>
                    <span id="kred-balance">KREDS: [INITIALIZING]</span>
                </div>
            </header>

            <main>
                <div class="banner">
                    <video autoplay loop muted playsinline width="168" height="398">
                        <source src="/assets/vid/exchangebanner.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="panel" id="unclaimed-panel">
                    <div class="corner-frame"></div> <!-- Added for frame effect -->
                    <h2 class="scramble-title">Monetize Data Parcels</h2>
                    <div id="parcel-list" class="data-list">
                        <!-- Data parcels will be populated here by JS -->
                    </div>
                    <p id="no-parcels-message" class="hidden">Accumulate at least 11 cognitive assets to form a data parcel.</p>
                </div>

                <div class="panel" id="leaderboard-panel">
                    <div class="corner-frame"></div> <!-- Added for frame effect -->
                    <h2 class="scramble-title">Operator Yield Report</h2>
                    <button id="refresh-leaderboard-btn">Refresh Report</button>
                    <div id="leaderboard-list" class="data-list">
                        <!-- Leaderboard will be populated here by JS -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="exchange.js"></script>

    <!-- NEW: YIELD SETTLEMENT REPORT MODAL -->
    <div id="settlement-report-modal" class="modal-overlay hidden">
        <div class="modal-window panel"> <!-- Re-using .panel class for style consistency -->
            <div class="corner-frame"></div> <!-- For the corner bracket effect -->
            <div class="modal-header">
                <h2 id="settlement-title" class="scramble-title">Yield Settlement Report</h2>
                <button id="settlement-dismiss-btn" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-content">
                <div id="settlement-summary"></div>
                <div id="settlement-list" class="data-list">
                    <!-- Report items will be generated by JS here -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
